<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CourierPR.com screenshot</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #faf8f3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .toolbar { height: 76px; background: #dee1e6; border-bottom: 1px solid #c7cacf; display: flex; align-items: center; padding: 0 20px; gap: 14px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #b7bac0; }
      .addressbar { flex: 1; max-width: 640px; height: 34px; background: #fff; border-radius: 17px; display: flex; align-items: center; padding: 0 16px; font-size: 13px; color: #3c4043; box-shadow: inset 0 0 0 1px #dcdfe3; }
      .icons { display: flex; gap: 18px; margin-left: auto; align-items: center; }
      .ph { width: 20px; height: 20px; border-radius: 4px; background: #b7bac0; }
      .ext { width: 26px; height: 26px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
      .popup { position: absolute; top: 94px; right: 40px; width: 390px; height: 640px; border: 0; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.22); background: #faf8f3; }
      .page { padding: 70px 60px; max-width: 700px; }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 44px; }
      .brand img { width: 30px; height: 30px; border-radius: 5px; }
      .brand b, h1 { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; color: #0f2420; }
      .brand b { font-size: 20px; }
      h1 { font-size: 40px; line-height: 1.15; margin: 0 0 16px; }
      p { font-size: 17px; line-height: 1.5; color: #3d3833; margin: 0; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="dot"></div><div class="dot"></div>
      <div class="addressbar">courierpr.com</div>
      <div class="icons"><div class="ph"></div><div class="ph"></div><img class="ext" src="../icons/icon32.png" alt="" /></div>
    </div>
    <div class="page">
      <div class="brand"><img src="../icons/icon48.png" alt="" /><b>CourierPR.com</b></div>
      <h1>The press release wire, one click from your toolbar</h1>
      <p>The latest releases on CourierPR.com, plus the newest in five categories picked fresh every time you open it.</p>
    </div>
    <iframe class="popup" src="../dev-preview.html"></iframe>
  </body>
</html>
