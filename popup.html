<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CourierPR.com</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 390px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #141210;
        background: #faf8f3;
      }
      .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif; }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 18px 12px;
        background: #0f2420;
      }
      .header img { width: 24px; height: 24px; border-radius: 4px; }
      .header span { font-weight: 700; font-size: 19px; color: #faf8f3; letter-spacing: 0.005em; }

      /* Category names run long ("Health & Medicine"), so the strip scrolls
         sideways rather than squeezing six tabs into 390px. */
      .tabs {
        display: flex;
        gap: 2px;
        padding: 0 10px;
        background: #1a3c34;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab {
        flex: none;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #b3c0b8;
        padding: 10px 9px 9px;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
      }
      .tab.active { color: #ffffff; border-bottom-color: #f0b429; }
      .tab:hover:not(.active) { color: #ffffff; }
      .tab:focus-visible { outline: 2px solid #f0b429; outline-offset: -2px; }

      .body { padding: 6px 18px 16px; }
      .feed-list { max-height: 420px; overflow-y: auto; }

      /* A column of stories under hairlines, like a wire page, not cards. */
      .story {
        display: block;
        text-decoration: none;
        color: inherit;
        padding: 12px 0 13px;
        border-bottom: 1px solid #d9d4ca;
      }
      .story:hover .story-title { color: #1a3c34; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      .story-meta { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
      .story-company { font-size: 12px; font-weight: 700; color: #7a5f3b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .story-time { font-size: 12px; font-weight: 600; color: #55504a; margin-left: auto; flex: none; }
      .story-title { font-size: 17px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
      .story-blurb {
        font-size: 13px;
        color: #3d3833;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .feed-empty, .feed-loading { font-size: 14px; font-weight: 600; color: #55504a; text-align: center; padding: 28px 0; }

      .feed-more { text-align: center; padding: 14px 0 2px; }
      .feed-more a { font-size: 14px; font-weight: 700; color: #1a3c34; text-decoration: none; }
      .feed-more a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icons/icon32.png" alt="" />
      <span class="serif">CourierPR.com</span>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="body">
      <div class="feed-list" id="feed-list">
        <div class="feed-loading">Loading the wire…</div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
